version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # jsdom/undici advisories are currently suppressed in .trivyignore pending
    # upstream fixes — Dependabot keeps those upgrades visible automatically.
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
