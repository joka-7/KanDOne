name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # @joka-7/modeldispatcher-browser-agent is on GitHub Packages, not the
        # public npm registry — GitHub Packages requires an authenticated
        # read even for a public repo's packages. NODE_AUTH_TOKEN must be a
        # repo secret: a PAT (classic or fine-grained) with read:packages
        # scope and access to joka-7/ModelDispatcher.
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Run unit tests with a coverage gate
        # Thresholds live in vite.config.js; --coverage makes them enforced.
        run: npm test -- --coverage

      - name: Verify E2E storage key parity
        run: npm test -- src/__tests__/storageKeys.e2eParity.test.js

      - name: Build
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # @joka-7/modeldispatcher-browser-agent is on GitHub Packages, not the
        # public npm registry — GitHub Packages requires an authenticated
        # read even for a public repo's packages. NODE_AUTH_TOKEN must be a
        # repo secret: a PAT (classic or fine-grained) with read:packages
        # scope and access to joka-7/ModelDispatcher.
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
